name: IAVMS checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  scheduling:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iavms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/iavms_test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql -X -v ON_ERROR_STOP=1 "$TEST_PG_URL" -f tests/scheduling-schema.sql
      - run: psql -X -v ON_ERROR_STOP=1 "$TEST_PG_URL" -f supabase/migrations/0011_teacher_scheduling_and_atomic_guards.sql
      - run: node --test tests/scheduling-concurrency.mjs
